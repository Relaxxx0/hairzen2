<!doctype html>
<html lang="tr" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--head-->
<meta name="theme-color" content="#0E1B3D">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Young+Serif&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Young+Serif&display=swap"></noscript>
<script>
// On the Turkish home page, send returning or foreign visitors to their language (never crawlers).
(function () {
  var d = document.documentElement, L = ["en", "de", "ar"], p = location.pathname, m = null, g = null;
  d.classList.replace("no-js", "js");
  if (p !== "/" && p !== "/index.html") return;
  if (/bot|crawl|spider|slurp|lighthouse|facebookexternalhit|whatsapp|telegram/i.test(navigator.userAgent)) return;
  try { m = localStorage.getItem("hz-lang"); g = sessionStorage.getItem("hz-geo-lang"); } catch (e) {}
  var go = function (l) { location.replace("/" + l + "/" + location.search + location.hash); };
  if (m) { if (L.indexOf(m) > -1) go(m); return; }
  if (g) { if (L.indexOf(g) > -1) go(g); return; }
  // Turkish-language browsers stay here without waiting for the country lookup (fast first paint).
  if (/^tr\b/i.test(navigator.language || "")) return;
  d.classList.add("hz-lang-wait");
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
